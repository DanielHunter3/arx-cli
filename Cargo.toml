[workspace]
members = [
    "schu",
    "domain"
]

[workspace.dependencies]
# CLI и парсинг
clap = { version = "4.4", features = ["derive", "env"] }
indicatif = "0.17" # прогресс-бары
console = "0.15"   # цветной вывод

anyhow = "1.0.100"

# Logging
env_logger = "0.11"
colored = "2.1"
log = "0.4"
chrono = "0.4.43"
